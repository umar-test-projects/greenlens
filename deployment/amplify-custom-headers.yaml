customHeaders:
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: https://y6yl9bz1u1.execute-api.ap-south-1.amazonaws.com https://api.open-meteo.com https://earth-search.aws.element84.com https://sentinel-cogs.s3.us-west-2.amazonaws.com https://e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'none'"
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: max-age=0, s-maxage=0, must-revalidate
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: max-age=0, s-maxage=0, must-revalidate
